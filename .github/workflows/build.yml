name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Disable automatic Java toolchain downloads
        run: |
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties

      - name: Verify Java
        run: java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Install Rust and Android targets
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 --tlsv1.3 \
            -sSf https://sh.rustup.rs | sh -s -- -y

          source "$HOME/.cargo/env"

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

          cargo install cargo-ndk

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup permanent signing keystore
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$AETHERY_KEYSTORE_BASE64" || {
            echo "AETHERY_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$AETHERY_KEYSTORE_PASSWORD" || {
            echo "AETHERY_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$AETHERY_KEY_ALIAS" || {
            echo "AETHERY_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$AETHERY_KEY_PASSWORD" || {
            echo "AETHERY_KEY_PASSWORD is missing"
            exit 1
          }

          echo "$AETHERY_KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore || {
            echo "The decoded keystore is empty"
            exit 1
          }

          cat > keystore.env <<EOF
          storePassword=$AETHERY_KEYSTORE_PASSWORD
          keyAlias=$AETHERY_KEY_ALIAS
          keyPassword=$AETHERY_KEY_PASSWORD
          EOF

      - name: Build hev-socks5-tunnel
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/26.3.11579264"

          if [ -d app/src/main/cpp/hev ]; then
            "$NDK/ndk-build" \
              -C app/src/main/cpp/hev \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk \
              -j"$(nproc)"

            for abi in arm64-v8a armeabi-v7a x86_64; do
              src="app/src/main/cpp/hev/libs/$abi/libhev-socks5-tunnel.so"
              dst="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"

              if [ -f "$src" ]; then
                mkdir -p "app/src/main/jniLibs/$abi"
                cp "$src" "$dst"
                echo "Built HEV for $abi"
              else
                echo "HEV library not found for $abi"
              fi
            done
          else
            echo "HEV source not present; skipping"
          fi

      - name: Grant Gradle execute permission
        run: |
          chmod +x gradlew
          chmod +x tools/rebrand.sh

      - name: Build signed Release APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PaetheryKeystore=release.keystore

      - name: Rename APK files
        run: |
          set -e

          cd app/build/outputs/apk/release

          for file in *.apk; do
            case "$file" in
              *arm64-v8a*) new="Yekta-VPN-arm64-v8a.apk" ;;
              *armeabi-v7a*) new="Yekta-VPN-armeabi-v7a.apk" ;;
              *x86_64*) new="Yekta-VPN-x86_64.apk" ;;
              *universal*) new="Yekta-VPN-universal.apk" ;;
              *) new="$file" ;;
            esac

            mv "$file" "$new"
          done

          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yekta-VPN-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
